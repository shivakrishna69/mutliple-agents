# Serves the built single-page app and forwards API and Socket.IO traffic to the backend, so the
# browser sees one origin: session cookies and CSRF work exactly as with the Vite dev proxy.
# The upstream address comes from BACKEND_UPSTREAM (default backend:5000, the compose service).

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Document vault uploads are capped at 10 MB by the backend; leave room for the multipart envelope.
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every asset file name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /invite/<token>, ...) all load index.html, which is never cached
    # so a new release is picked up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        try_files $uri /index.html;
    }
}
