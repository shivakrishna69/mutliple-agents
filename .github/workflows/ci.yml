# Checks every pull request and every push to main: lint, formatting, tests and builds for all
# three services. A pull request should only be merged when every job is green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired-names:
    name: No retired product names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:names

  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (package.json engines) and the recommended one.
        node-version: [22, 24]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Integration tests fail instead of skipping when MongoDB is unreachable in CI.
      CI: "true"
      TEST_MONGO_URL: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official image with Chromium and its system libraries preinstalled (Node 24). Its version must
    # match @playwright/test in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      # Inside a job container, services are reached by their name.
      TEST_MONGO_URL: mongodb://mongo:27017
    steps:
      - uses: actions/checkout@v4
      # The browser tests start the real backend (e2e/globalSetup.js), so both packages are installed.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Keep the report and traces when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same version as the Docker image (python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  compose-stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Outside the checkout, so throwaway secrets can never be committed or enter a build context.
      BACKEND_ENV_FILE: /tmp/ci-backend.env
      AI_SERVICE_ENV_FILE: /tmp/ci-ai-service.env
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway configuration
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "WEBHOOK_SIGNING_SECRET=$(openssl rand -hex 32)"
            echo "AI_SERVICE_API_KEY=$(openssl rand -hex 32)"
          } > "$BACKEND_ENV_FILE"
          touch "$AI_SERVICE_ENV_FILE"
      - run: docker compose config --quiet
      # The AI service is left out: without a Groq key it reports itself unhealthy by design, and
      # nothing the web stack needs depends on it.
      - name: Build and start the web stack
        run: docker compose up --detach --build --wait frontend
      - name: Smoke-test through nginx
        run: |
          set -euo pipefail
          base=http://localhost:8080
          origin="Origin: http://localhost:8080"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/invite/any-client-route")" = 200
          curl -sf "$base/api/health"
          signup_status=$(curl -s -c cookies.txt -H "$origin" -H 'Content-Type: application/json' \
            -d '{"name":"CI Check","email":"ci.check@example.com","password":"Valid#Pass2026"}' \
            -o /dev/null -w '%{http_code}' "$base/api/auth/signup")
          test "$signup_status" = 201
          curl -sf -b cookies.txt -H "$origin" "$base/api/auth/me" > /dev/null
          test "$(curl -s -b cookies.txt -H "$origin" -o /dev/null -w '%{http_code}' "$base/socket.io/?EIO=4&transport=polling")" = 200
          test "$(curl -s -H 'Origin: https://evil.example' -o /dev/null -w '%{http_code}' "$base/socket.io/?EIO=4&transport=polling")" = 403
          echo "stack answers correctly through nginx"
      - name: Show logs when something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  ai-service-image:
    name: AI service Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --tag multiagent-ai-service:ci ai-service
      - name: Check the image starts and answers its health endpoint
        run: |
          docker run --detach --name ai-service-ci --publish 8000:8000 \
            --env AI_SERVICE_API_KEY=ci-only-internal-key-0123456789abcdef \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            multiagent-ai-service:ci
          # Without GROQ_API_KEY the service runs degraded and /health answers 503 by design.
          for _ in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$status" = "503" ] || [ "$status" = "200" ]; then
              echo "health endpoint answered $status"
              exit 0
            fi
            sleep 1
          done
          docker logs ai-service-ci
          exit 1
