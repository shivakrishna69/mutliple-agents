# Checks every pull request and every push to main: lint, formatting, tests and builds for all
# three services. A pull request should only be merged when every job is green.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired-names:
    name: No retired product names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:names

  backend:
    name: Backend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version (package.json engines) and the recommended one.
        node-version: [22, 24]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # For the employee import test that runs on the BullMQ queue.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Integration tests fail instead of skipping when MongoDB is unreachable in CI.
      CI: "true"
      TEST_MONGO_URL: mongodb://127.0.0.1:27017
      TEST_REDIS_URL: redis://127.0.0.1:6379
      # Offer letter tests: the runner's Google Chrome renders PDFs, qpdf (installed below) locks them.
      PDF_BROWSER_CHANNEL: chrome
      QPDF_PATH: qpdf
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # qpdf from its own release, pinned and checked against its published SHA-256, rather than from
      # apt: the runner image's extra apt sources can make `apt-get update` fail (it did when
      # ubuntu-latest moved to Ubuntu 26). The release zip carries its own libraries.
      - name: Install qpdf
        env:
          QPDF_VERSION: 12.4.2
          QPDF_SHA256: db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/qpdf.zip" \
            "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/qpdf-${QPDF_VERSION}-bin-linux-x86_64.zip"
          echo "${QPDF_SHA256}  $RUNNER_TEMP/qpdf.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qpdf/bin/qpdf" --version
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Renders and locks a sample letter with the runner's Chrome and qpdf before the tests, so a
      # broken PDF toolchain fails here with its cause shown on the run's summary page.
      - name: Check offer letter PDFs on the runner
        run: |
          if ! check_output=$(node scripts/checkOfferLetterPdf.js 2>&1); then
            echo "$check_output"
            echo "::error title=Offer letter PDFs::$(echo "$check_output" | grep -m1 'offer letters: FAILED' || echo 'the check stopped without a result; see the log')"
            exit 1
          fi
          echo "$check_output"
      - run: npm test

  offer-letter-pdfs:
    name: Offer letter PDFs (production image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image with its PDF tools, as production does
        run: docker build --build-arg WITH_PDF_BROWSER=true --tag nsk-backend-pdf ./backend
      - name: Render and lock a sample letter inside it, under the production restrictions
        run: |
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --env PDF_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium --env LOG_LEVEL=error \
            --entrypoint node nsk-backend-pdf scripts/checkOfferLetterPdf.js

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  browser-tests:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official image with Chromium and its system libraries preinstalled (Node 24). Its version must
    # match @playwright/test in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      # Inside a job container, services are reached by their name.
      TEST_MONGO_URL: mongodb://mongo:27017
    steps:
      - uses: actions/checkout@v4
      # The browser tests start the real backend (e2e/globalSetup.js), so both packages are installed.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Keep the report and traces when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # For tests/test_knowledge_index.py: the same Qdrant version as the compose files.
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6333:6333
        env:
          QDRANT__SERVICE__API_KEY: ci-only-qdrant-key-0123456789abcdef
          QDRANT__TELEMETRY_DISABLED: "true"
    env:
      # The knowledge index tests fail instead of skipping when Qdrant is unreachable in CI.
      CI: "true"
      TEST_QDRANT_URL: http://127.0.0.1:6333
      TEST_QDRANT_API_KEY: ci-only-qdrant-key-0123456789abcdef
      TEST_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.embedding-model
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      # The embedding model (about 65 MB) is downloaded once per version of its pinned files.
      - uses: actions/cache@v4
        with:
          path: .embedding-model
          key: embedding-model-${{ hashFiles('ai-service/app/knowledge/embedding_model.sha256') }}
      - uses: actions/setup-python@v5
        with:
          # Same version as the Docker image (python:3.11-slim).
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  compose-stack:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Outside the checkout, so throwaway secrets can never be committed or enter a build context.
      BACKEND_ENV_FILE: /tmp/ci-backend.env
      AI_SERVICE_ENV_FILE: /tmp/ci-ai-service.env
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway configuration
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "WEBHOOK_SIGNING_SECRET=$(openssl rand -hex 32)"
            echo "AI_SERVICE_API_KEY=$(openssl rand -hex 32)"
            # Signing up emails a confirmation link: send it to Mailpit (the compose "mail" profile).
            echo "SMTP_HOST=mailpit"
            echo "SMTP_PORT=1025"
            echo "SMTP_REQUIRE_TLS=false"
            echo "MAIL_FROM=CI <ci@example.com>"
          } > "$BACKEND_ENV_FILE"
          touch "$AI_SERVICE_ENV_FILE"
          # Compose passes it to Qdrant and the AI service.
          echo "QDRANT_API_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: docker compose --profile mail config --quiet
      # The AI service is left out: without a Groq key it reports itself unhealthy by design, and
      # nothing the web stack needs depends on it.
      - name: Build and start the web stack
        run: docker compose --profile mail up --detach --build --wait frontend mailpit
      - name: Check the backend image holds no test code
        run: |
          set -euo pipefail
          # The build context is an allowlist (backend/.dockerignore) and dev dependencies are not
          # installed; this proves it on the built image.
          docker compose exec -T backend sh -c '
            test ! -e /app/tests &&
            test ! -e /app/node_modules/smtp-server &&
            test ! -e /app/node_modules/mailparser &&
            ! grep -rlE "mailCatcher|startTestServer" /app --include=*.js --exclude-dir=node_modules'
          echo "no test code in the backend image"
      - name: Smoke-test through nginx
        run: |
          set -euo pipefail
          base=http://localhost:8080
          origin="Origin: http://localhost:8080"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/invite/any-client-route")" = 200
          curl -sf "$base/api/health"
          signup_status=$(curl -s -H "$origin" -H 'Content-Type: application/json' \
            -d '{"firstName":"CI","lastName":"Check","email":"ci.check@example.com","phoneNumber":"98765 43210","dateOfBirth":"1990-05-17","gender":"prefer_not_to_say","password":"Valid#Pass2026","confirmPassword":"Valid#Pass2026","acceptTerms":true}' \
            -o /dev/null -w '%{http_code}' "$base/api/auth/signup")
          test "$signup_status" = 202
          # The confirmation link arrives by email (Mailpit); opening it signs the person in.
          token=""
          for attempt in $(seq 1 20); do
            token=$(curl -s http://localhost:8025/api/v1/message/latest | grep -oE 'verify-email/[A-Za-z0-9_-]{43}' | head -1 | cut -d/ -f2 || true)
            [ -n "$token" ] && break
            sleep 1
          done
          test -n "$token"
          verify_status=$(curl -s -c cookies.txt -H "$origin" -H 'Content-Type: application/json' \
            -d "{\"token\":\"$token\"}" -o /dev/null -w '%{http_code}' "$base/api/auth/verify-email")
          test "$verify_status" = 200
          curl -sf -b cookies.txt -H "$origin" "$base/api/auth/me" > /dev/null
          test "$(curl -s -b cookies.txt -H "$origin" -o /dev/null -w '%{http_code}' "$base/socket.io/?EIO=4&transport=polling")" = 200
          test "$(curl -s -H 'Origin: https://evil.example' -o /dev/null -w '%{http_code}' "$base/socket.io/?EIO=4&transport=polling")" = 403
          echo "stack answers correctly through nginx"
      - name: Show logs when something failed
        if: failure()
        run: docker compose --profile mail logs
      - name: Stop the stack
        if: always()
        run: docker compose --profile mail down --volumes

  deployment-files:
    name: Deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway settings outside the checkout, in the shape deploy/setup-server.sh writes them.
      STACK_ENV_FILE: /tmp/ci-stack.env
      BACKEND_ENV_FILE: /tmp/ci-backend.env
      AI_SERVICE_ENV_FILE: /tmp/ci-ai-service.env
    steps:
      - uses: actions/checkout@v4
      - name: Check the scripts
        run: shellcheck --severity=warning deploy/*.sh
      - name: Check the production compose file
        run: |
          set -euo pipefail
          printf '%s\n' APP_DOMAIN=ci.example.com ACME_EMAIL=ci@example.com MONGO_ROOT_USERNAME=nsk \
            "MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)" "REDIS_PASSWORD=$(openssl rand -hex 24)" \
            "QDRANT_API_KEY=$(openssl rand -hex 32)" > "$STACK_ENV_FILE"
          touch "$BACKEND_ENV_FILE" "$AI_SERVICE_ENV_FILE"
          docker compose -f docker-compose.prod.yml --env-file "$STACK_ENV_FILE" config --quiet
      - name: Check the Caddy configuration
        run: |
          docker run --rm -e APP_DOMAIN=ci.example.com -e ACME_EMAIL=ci@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  ai-service-image:
    name: AI service Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --tag multiagent-ai-service:ci ai-service
      - name: Check the image starts and answers its health endpoint
        run: |
          docker run --detach --name ai-service-ci --publish 8000:8000 \
            --env AI_SERVICE_API_KEY=ci-only-internal-key-0123456789abcdef \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            multiagent-ai-service:ci
          # Without GROQ_API_KEY the service runs degraded and /health answers 503 by design.
          for _ in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$status" = "503" ] || [ "$status" = "200" ]; then
              echo "health endpoint answered $status"
              exit 0
            fi
            sleep 1
          done
          docker logs ai-service-ci
          exit 1
