# Deploys main to the production server after CI has passed on it, and on demand (Actions -> Deploy
# -> Run workflow). The server pulls the commit, rebuilds and restarts the stack, and starts the
# previous version again if the new one does not become healthy (deploy/deploy.sh).
#
# Off until the repository variable DEPLOY_ENABLED is "true". Set up with docs/deployment.md;
# Settings -> Secrets and variables -> Actions holds:
#   secrets    DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (a key the server lets run deploy.sh only),
#              DEPLOY_KNOWN_HOSTS (the server's host key, printed by deploy/setup-server.sh)
#   variables  DEPLOY_ENABLED, APP_URL (https://your-domain)

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order; a deploy that has started is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Deploy on the server
        env:
          # The commit CI checked; a manual run deploys the branch it was started from (the server
          # refuses anything that is not on main).
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for setting in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!setting}" ]; then echo "::error::the secret $setting is not set"; exit 1; fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's key only runs deploy/deploy.sh, which receives the commit as its command.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "$COMMIT_SHA"

      - name: Check the site answers over HTTPS
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ]; then echo "::warning::the variable APP_URL is not set; skipping the check"; exit 0; fi
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$APP_URL/api/health"
          echo
          echo "$APP_URL is up"

      - name: Forget the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
