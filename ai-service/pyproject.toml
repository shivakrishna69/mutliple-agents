# Tool configuration for the ai-service. Runtime dependencies stay in requirements.txt.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, BLE blind except, UP pyupgrade,
# SIM simplify, ASYNC async pitfalls, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",   # line length is owned by the formatter
    "UP042",  # (str, Enum) -> StrEnum changes str() output; not a lint-only change
    "SIM105", # explicit try/except around task cancellation reads clearer than contextlib.suppress
]
# Typographic quotes and dashes are matched on purpose (output guard, comments).
allowed-confusables = ["’", "–"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"
