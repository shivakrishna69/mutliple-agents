# The whole stack on one machine: docker compose up --build, then open http://localhost:8080.
#
# Secrets and optional integrations (Groq, SMTP, S3...) come from backend/.env and ai-service/.env,
# the same files used for local development (BACKEND_ENV_FILE / AI_SERVICE_ENV_FILE select other
# files, as CI does); `environment:` below overrides only the addresses that differ inside the
# compose network. Only the frontend is published (port 8080), so this runs next to the dev servers
# and the standalone multiagent-mongo / multiagent-ai-service containers.
#
# This stack serves plain HTTP on localhost, so the backend runs with NODE_ENV=development (secure
# cookies and https URLs are required in production). For a real deployment, put it behind TLS and
# set NODE_ENV=production, COOKIE_SECURE=true and https URLs.
#
# Email: signing up needs it (the confirmation link is emailed). To catch every email locally instead
# of sending it, start Mailpit too and point the backend at it in backend/.env:
#   docker compose --profile mail up --build
#   SMTP_HOST=mailpit  SMTP_PORT=1025  SMTP_REQUIRE_TLS=false  MAIL_FROM="NSK HR <hr@localhost>"
# and read the emails at http://localhost:8025.

# The project name also names the database volume (nsk_mongo-data).
name: nsk

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ${BACKEND_ENV_FILE:-backend/.env}
        required: true
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/nsk
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: http://localhost:8080
      APP_PUBLIC_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      # nginx in the frontend container is the one proxy in front of the backend.
      TRUST_PROXY_HOPS: "1"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file:
      - path: ${AI_SERVICE_ENV_FILE:-ai-service/.env}
        required: true
    environment:
      # Development rules: the backend is reached over plain HTTP inside the compose network.
      APP_ENV: development
      BACKEND_INTERNAL_URL: http://backend:5000
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    depends_on:
      qdrant:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The department knowledge index (see docker-compose.prod.yml). Not published: only the AI service
  # reaches it.
  qdrant:
    image: qdrant/qdrant:v1.20.0-unprivileged
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY (at least 32 characters) in your shell or a .env file next to this one}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant-data:/qdrant/storage
    read_only: true
    tmpfs:
      - /tmp
      - /qdrant/snapshots:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:5000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Optional (--profile mail): a local mail catcher. Nothing it receives leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.21.8
    profiles: [mail]
    restart: unless-stopped
    ports:
      - "8025:8025"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  mongo-data:
  qdrant-data:
