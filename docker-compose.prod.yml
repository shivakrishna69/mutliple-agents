# Production: the whole stack on one server behind Caddy, which serves HTTPS for APP_DOMAIN with a
# free Let's Encrypt certificate. See docs/deployment.md; deploy/setup-server.sh prepares a server
# and deploy/deploy.sh runs this file.
#
#   docker compose -f docker-compose.prod.yml --env-file /etc/nsk/stack.env up --detach --build --wait
#
# Settings live on the server, outside the checkout, and are never committed:
#   /etc/nsk/stack.env       APP_DOMAIN, ACME_EMAIL, the database and Redis passwords and the Qdrant
#                            API key (used below)
#   /etc/nsk/backend.env     the backend's secrets and options (JWT_SECRET, SMTP_*, ...)
#   /etc/nsk/ai-service.env  the AI service's (AI_SERVICE_API_KEY, GROQ_API_KEY, ...)
#
# Only Caddy publishes ports (80 and 443). MongoDB, Redis and Qdrant require passwords or keys and are
# reachable only inside the compose network. Images are built on the server, so they match its CPU (Oracle's ARM).

name: nsk

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in the stack settings}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in the stack settings}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Queues the employee imports. Job state lives in MongoDB, so Redis keeps nothing on disk.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in the stack settings}
    environment:
      # redis-cli (the health check) reads the password from here.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        # Chromium and qpdf for payslips and offer letters (backend/Dockerfile).
        WITH_PDF_BROWSER: "true"
    restart: unless-stopped
    env_file:
      - path: ${BACKEND_ENV_FILE:-/etc/nsk/backend.env}
        required: true
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/nsk?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      APP_PUBLIC_URL: https://${APP_DOMAIN:?set APP_DOMAIN in the stack settings}
      CORS_ORIGINS: https://${APP_DOMAIN}
      COOKIE_SECURE: "true"
      # Caddy, then nginx in the frontend container.
      TRUST_PROXY_HOPS: "2"
      # Installed in the image by WITH_PDF_BROWSER; qpdf is on the PATH (QPDF_PATH defaults to "qpdf").
      PDF_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    # Chromium's profile and qpdf's working files: private, in memory, gone on restart.
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    env_file:
      - path: ${AI_SERVICE_ENV_FILE:-/etc/nsk/ai-service.env}
        required: true
    environment:
      APP_ENV: production
      SIMULATED_TOOLS_ENABLED: "false"
      # Production requires https here. APP_DOMAIN resolves to Caddy inside this network (its alias
      # below), so these calls are encrypted and never leave the server.
      BACKEND_INTERNAL_URL: https://${APP_DOMAIN}
      # The department knowledge index (Qdrant below), reached only inside this network.
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    depends_on:
      qdrant:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Vector index of the department knowledge bases (ai-service/app/knowledge/). Every chunk can be
  # rebuilt from the documents in MongoDB, so its data is not part of the database backup. The
  # image has no shell tools for a health check; the AI service creates its collection on first use
  # and answers 503 until Qdrant is up, which the backend retries.
  qdrant:
    image: qdrant/qdrant:v1.20.0-unprivileged
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in the stack settings (deploy/setup-server.sh adds it)}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__LOG_LEVEL: WARN
    volumes:
      - qdrant-data:/qdrant/storage
    read_only: true
    tmpfs:
      - /tmp
      - /qdrant/snapshots:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:5000
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the stack settings}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: kept across restarts, so Let's Encrypt is not asked again on every deploy.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        aliases:
          - ${APP_DOMAIN}
    depends_on:
      frontend:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  mongo-data:
  qdrant-data:
  caddy-data:
  caddy-config:
